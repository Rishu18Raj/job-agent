name: Tier 3 Daily Discovery

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST daily, offset from Tier 1
  workflow_dispatch: {}

jobs:
  run-tier3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run Tier 3 pipeline
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python -m src.tier3_pipeline

      - name: Commit updated dedup state
        run: |
          git config user.name "job-agent-bot"
          git config user.email "actions@github.com"
          git add data/seen_jobs.db
          git diff --staged --quiet || git commit -m "Update Tier3 dedup state [skip ci]"
          git push
