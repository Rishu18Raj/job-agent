name: Sync Tier 2 Companies

on:
  schedule:
    - cron: "0 2 * * *"   # 07:30 IST daily, before the first Tier2 scan of the day
  workflow_dispatch: {}
  push:
    paths:
      - "data/tier2_companies.txt"   # also run immediately when you edit the list

jobs:
  sync-tier2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Discover new Tier 2 companies
        run: python -m src.sync_tier2_companies

      - name: Commit updated company list
        run: |
          git config user.name "job-agent-bot"
          git config user.email "actions@github.com"
          git add config/companies_tier2.yaml
          git diff --staged --quiet || git commit -m "Auto-discover new Tier 2 companies [skip ci]"
          git push
